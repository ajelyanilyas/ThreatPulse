# Render blueprint: one web service + one managed Postgres, all free tier.
# Deploy: push this repo to GitHub, then in Render → "New +" → "Blueprint".
services:
  - type: web
    name: threatpulse
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: threatpulse-db
          property: connectionString
      - key: INGEST_INTERVAL_MINUTES
        value: "60"
      - key: INGEST_ON_STARTUP
        value: "true"
      # Free abuse.ch Auth-Key unlocks the ThreatFox feed. Get one at
      # https://auth.abuse.ch — then set this in the Render dashboard.
      - key: ABUSECH_AUTH_KEY
        sync: false
      # Optional enrichment providers; leave unset to use local heuristics only.
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: OTX_API_KEY
        sync: false

databases:
  - name: threatpulse-db
    plan: free
    region: oregon
